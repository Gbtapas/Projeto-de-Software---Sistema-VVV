name: CI

on:
  push:
    branches: [main, develop, "feature/**", "bugfix/**", "release/**"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: app/pom.xml
      - name: Run unit tests
        working-directory: app
        run: ./mvnw -B test

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: app/pom.xml
      - name: Run integration tests
        working-directory: app
        run: ./mvnw -B -DskipUnitTests=true verify

  sonar:
    name: SonarCloud analysis
    needs: [unit-tests, integration-tests]
    if: ${{ env.SONAR_TOKEN != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: app/pom.xml
      - name: Generate coverage report
        working-directory: app
        run: ./mvnw -B test
      - name: Run SonarCloud scan
        working-directory: app
        run: ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar

  docker-build:
    name: Docker image build
    needs: [unit-tests, integration-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build Docker image
        run: docker build --tag reservas:${{ github.sha }} .
