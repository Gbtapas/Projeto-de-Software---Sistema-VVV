name: CI

on:
  push:
    branches: [main, develop, "feature/**", "bugfix/**", "release/**"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: app/pom.xml
      - name: Run unit tests
        working-directory: app
        run: |
          chmod +x mvnw
          ./mvnw -B test

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: app/pom.xml
      - name: Run integration tests
        working-directory: app
        run: |
          chmod +x mvnw
          ./mvnw -B -DskipUnitTests=true verify

  sonar:
    name: SonarCloud analysis
    needs: [unit-tests, integration-tests]
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: app/pom.xml
      - name: Validate SonarCloud credentials
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::O segredo SONAR_TOKEN nao foi disponibilizado ao workflow."
            exit 1
          fi
          if ! curl --fail --silent --show-error --user "${SONAR_TOKEN}:" https://sonarcloud.io/api/authentication/validate | grep -q '"valid":true'; then
            echo "::error::O token do SonarCloud nao foi aceito. Gere outro token e atualize o segredo SONAR_TOKEN."
            exit 1
          fi
      - name: Generate coverage report
        working-directory: app
        run: |
          chmod +x mvnw
          ./mvnw -B test
      - name: Run SonarCloud scan
        working-directory: app
        run: |
          chmod +x mvnw
          ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.token="${SONAR_TOKEN}"

  docker-build:
    name: Docker image build
    needs: [unit-tests, integration-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build Docker image
        run: docker build --tag reservas:${{ github.sha }} .
